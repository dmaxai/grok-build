# Tiny always-green canary so GitHub App check_suite / checks_completed
# automations have something to fire on. Not a real product CI.
name: gh-e2e-canary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: e2e canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Success marker
        run: |
          echo "gh-e2e canary ok"
          echo "event=${{ github.event_name }} ref=${{ github.ref }} sha=${{ github.sha }}"
